<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (peserAnimal(); as peserAnimalRef) {
    <div>
      <h2 data-cy="peserAnimalDetailsHeading"><span jhiTranslate="petclinicApp.peserAnimal.detail.title">Peser Animal</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ peserAnimalRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="petclinicApp.peserAnimal.poids">Poids</span></dt>
        <dd>
          <span>{{ peserAnimalRef.poids }}</span>
        </dd>
        <dt><span jhiTranslate="petclinicApp.peserAnimal.rendezVous">Rendez Vous</span></dt>
        <dd>
          @if (peserAnimal()!.rendezVous) {
          <div>
            <a [routerLink]="['/rendez-vous', peserAnimal()!.rendezVous?.id, 'view']">{{ peserAnimalRef.rendezVous?.id }}</a>
          </div>
          }
        </dd>
        <dt><span jhiTranslate="petclinicApp.peserAnimal.animal">Animal</span></dt>
        <dd>
          @if (peserAnimal()!.animal) {
          <div>
            <a [routerLink]="['/animal', peserAnimal()!.animal?.id, 'view']">{{ peserAnimalRef.animal?.id }}</a>
          </div>
          }
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
      </button>

      <button type="button" [routerLink]="['/peser-animal', peserAnimalRef.id, 'edit']" class="btn btn-primary" data-cy="entityEditButton">
        <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
      </button>
    </div>
    }
  </div>
</div>
