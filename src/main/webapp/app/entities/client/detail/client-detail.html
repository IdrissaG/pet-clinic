<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (client(); as clientRef) {
    <div>
      <h2 data-cy="clientDetailsHeading"><span jhiTranslate="petclinicApp.client.detail.title">Client</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ clientRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="petclinicApp.client.nom">Nom</span></dt>
        <dd>
          <span>{{ clientRef.nom }}</span>
        </dd>
        <dt><span jhiTranslate="petclinicApp.client.prenom">Prenom</span></dt>
        <dd>
          <span>{{ clientRef.prenom }}</span>
        </dd>
        <dt><span jhiTranslate="petclinicApp.client.adresse">Adresse</span></dt>
        <dd>
          <span>{{ clientRef.adresse }}</span>
        </dd>
        <dt><span jhiTranslate="petclinicApp.client.telephone">Telephone</span></dt>
        <dd>
          <span>{{ clientRef.telephone }}</span>
        </dd>
        <dt><span jhiTranslate="petclinicApp.client.email">Email</span></dt>
        <dd>
          <span>{{ clientRef.email }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
      </button>

      <button type="button" [routerLink]="['/client', clientRef.id, 'edit']" class="btn btn-primary" data-cy="entityEditButton">
        <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
      </button>
    </div>
    }
  </div>
</div>
