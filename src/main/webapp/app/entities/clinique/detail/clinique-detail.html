<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (clinique(); as cliniqueRef) {
    <div>
      <h2 data-cy="cliniqueDetailsHeading"><span jhiTranslate="petclinicApp.clinique.detail.title">Clinique</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ cliniqueRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="petclinicApp.clinique.nom">Nom</span></dt>
        <dd>
          <span>{{ cliniqueRef.nom }}</span>
        </dd>
        <dt><span jhiTranslate="petclinicApp.clinique.adresse">Adresse</span></dt>
        <dd>
          <span>{{ cliniqueRef.adresse }}</span>
        </dd>
        <dt><span jhiTranslate="petclinicApp.clinique.telephone">Téléphone</span></dt>
        <dd>
          <span>{{ cliniqueRef.telephone }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
      </button>

      <button type="button" [routerLink]="['/clinique', cliniqueRef.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
      </button>
    </div>
    }
  </div>
</div>
