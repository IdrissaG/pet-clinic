<div>
  <h2 id="page-heading" data-cy="CliniqueHeading">
    <span jhiTranslate="petclinicApp.clinique.home.title">Cliniques</span>

    <!-- Carte de Recherche & Filtres  -->
    <div class="search-bar-container bg-white rounded-4 p-3 shadow-sm border mb-4">
      <div class="row g-3 align-items-end">
        <!-- Champ Recherche -->
        <div class="col-12 col-md-8 col-lg-8">
          <label class="form-label small fw-semibold text-muted mb-1" jhiTranslate="petclinicApp.clinique.search.label"
            >Rechercher une clinique</label
          >
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted ps-3"> 🔍 </span>
            <input
              type="text"
              class="form-control bg-light border-start-0 ps-0 shadow-none"
              placeholder="Nom de la clinique, adresse, ville..."
              jhiTranslate="petclinicApp.clinique.search.placeholder"
            />
          </div>
        </div>

        <!-- Boutons d'action -->
        <div class="col-12 col-md-4 col-lg-4 d-flex gap-2">
          <button type="button" class="btn btn-outline-secondary w-50 py-2 d-flex align-items-center justify-content-center gap-2">
            <i class="fa-solid fa-rotate-left"></i>
            <span>Réinitialiser</span>
          </button>

          <button type="button" class="btn btn-primary w-50 fw-semibold py-2">Filtrer</button>
        </div>
      </div>
    </div>
    <div class="d-flex justify-content-end">
      <button class="btn btn-info me-2" (click)="load()" [disabled]="isLoading()">
        <fa-icon icon="sync" [animation]="isLoading() ? 'spin' : undefined" />
        <span jhiTranslate="petclinicApp.clinique.home.refreshListLabel">Actualiser la liste</span>
      </button>

      <button
        id="jh-create-entity"
        data-cy="entityCreateButton"
        class="btn btn-primary jh-create-entity create-clinique"
        [routerLink]="['/clinique/new']"
      >
        <fa-icon icon="plus" />
        <span jhiTranslate="petclinicApp.clinique.home.createLabel">Créer un nouveau Clinique</span>
      </button>
    </div>
  </h2>

  <jhi-alert-error />

  <jhi-alert />

  @if (cliniques().length === 0) {
  <div class="alert alert-warning" id="no-result">
    <span jhiTranslate="petclinicApp.clinique.home.notFound">Aucun Clinique trouvé</span>
  </div>
  } @else {
  <div class="table-responsive table-entities" id="entities">
    <table class="table table-striped" aria-describedby="page-heading">
      <thead>
        <tr jhiSort [(sortState)]="sortState" (sortChange)="navigateToWithComponentValues($event)">
          <th scope="col" jhiSortBy="id">
            <div class="d-flex">
              <span jhiTranslate="global.field.id">ID</span>

              <fa-icon class="p-1" icon="sort" />
            </div>
          </th>
          <th scope="col" jhiSortBy="nom">
            <div class="d-flex">
              <span jhiTranslate="petclinicApp.clinique.nom">Nom</span>

              <fa-icon class="p-1" icon="sort" />
            </div>
          </th>
          <th scope="col" jhiSortBy="adresse">
            <div class="d-flex">
              <span jhiTranslate="petclinicApp.clinique.adresse">Adresse</span>

              <fa-icon class="p-1" icon="sort" />
            </div>
          </th>
          <th scope="col" jhiSortBy="telephone">
            <div class="d-flex">
              <span jhiTranslate="petclinicApp.clinique.telephone">Telephone</span>

              <fa-icon class="p-1" icon="sort" />
            </div>
          </th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        @for (clinique of cliniques(); track trackId(clinique)) {
        <tr data-cy="entityTable">
          <td><a [routerLink]="['/clinique', clinique.id, 'view']">{{ clinique.id }}</a></td>
          <td>{{ clinique.nom }}</td>
          <td>{{ clinique.adresse }}</td>
          <td>{{ clinique.telephone }}</td>
          <td class="text-end">
            <div class="btn-group">
              <a [routerLink]="['/clinique', clinique.id, 'view']" class="btn btn-info btn-sm" data-cy="entityDetailsButton">
                <fa-icon icon="eye" />
                <span class="d-none d-md-inline" jhiTranslate="entity.action.view">Voir</span>
              </a>

              <a [routerLink]="['/clinique', clinique.id, 'edit']" class="btn btn-primary btn-sm" data-cy="entityEditButton">
                <fa-icon icon="pencil-alt" />
                <span class="d-none d-md-inline" jhiTranslate="entity.action.edit">Editer</span>
              </a>

              <button type="submit" (click)="delete(clinique)" class="btn btn-danger btn-sm" data-cy="entityDeleteButton">
                <fa-icon icon="times" />
                <span class="d-none d-md-inline" jhiTranslate="entity.action.delete">Supprimer</span>
              </button>
            </div>
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
  } @if (cliniques().length > 0) {
  <div>
    <div class="d-flex justify-content-center">
      <jhi-item-count [params]="{ page: page(), totalItems: totalItems(), itemsPerPage: itemsPerPage() }" />
    </div>

    <div class="d-flex justify-content-center">
      <ngb-pagination
        [collectionSize]="totalItems()"
        [page]="page()"
        [pageSize]="itemsPerPage()"
        [maxSize]="5"
        [rotate]="true"
        [boundaryLinks]="true"
        (pageChange)="navigateToPage($event)"
      />
    </div>
  </div>
  }
</div>
